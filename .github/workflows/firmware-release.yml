name: Build & Publish Monstatek M1 + ESP32-C6 Release Artifacts

on:
  push:
    branches: [ main, "feat/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-stm32h573:
    name: Build STM32H573 Main Firmware (GCC 14.2.Rel1 + CRC-32)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Farryan/M1-Custom-FW
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies & SRecord (srec_cat)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build srecord python3

      - name: Install Arm GNU Toolchain 14.2.Rel1
        run: |
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz
          sudo mkdir -p /opt/arm-gnu-toolchain-14.2.rel1
          sudo tar -xJf arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz -C /opt/arm-gnu-toolchain-14.2.rel1 --strip-components=1
          echo "/opt/arm-gnu-toolchain-14.2.rel1/bin" >> $GITHUB_PATH

      - name: Build STM32H573 Firmware via project build.sh
        run: |
          set -euxo pipefail
          arm-none-eabi-gcc --version
          ./build.sh --release

      - name: Upload STM32 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stm32h573-firmware
          path: |
            ./artifacts/MonstaTek_M1_v0800.bin
            ./artifacts/MonstaTek_M1_v0800.elf
            ./artifacts/MonstaTek_M1_v0800.hex
            ./artifacts/MonstaTek_M1_v0800_wCRC.bin

  build-esp32c6:
    name: Build Companion ESP32-C6 Firmware (ESP-IDF v5.3.2)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile ESP32-C6 Coprocessor Firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32c6
          path: esp32_c6_fw
          command: idf.py build

      - name: Package esp32_c6_fw.bin and MD5 Sidecar
        run: |
          mkdir -p ./artifacts/esp32_c6
          cp esp32_c6_fw/build/m1_esp32c6_coprocessor.bin ./artifacts/esp32_c6/esp32_c6_fw.bin
          python3 -c 'import hashlib, pathlib; p = pathlib.Path("./artifacts/esp32_c6/esp32_c6_fw.bin"); pathlib.Path("./artifacts/esp32_c6/esp32_c6_fw.bin.md5").write_text(hashlib.md5(p.read_bytes()).hexdigest() + "  " + p.name + "\n");'
          ls -lh ./artifacts/esp32_c6/

      - name: Upload ESP32-C6 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32c6-firmware
          path: |
            ./artifacts/esp32_c6/esp32_c6_fw.bin
            ./artifacts/esp32_c6/esp32_c6_fw.bin.md5

  package-sd-assets:
    name: Build UberGuidoZ M1 SD Asset Archive
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone UberGuidoZ/Flipper & Convert Assets
        run: |
          git clone --depth 1 https://github.com/UberGuidoZ/Flipper.git /tmp/UberGuidoZ-Flipper
          mkdir -p ./artifacts
          python3 ./scripts/sync_uberguidoz.py --source /tmp/UberGuidoZ-Flipper -o ./artifacts/M1_SD_Assets.zip

      - name: Upload SD Card Bundle
        uses: actions/upload-artifact@v4
        with:
          name: m1-sd-assets
          path: ./artifacts/M1_SD_Assets.zip

  publish-github-release:
    name: Publish GitHub Release on Farryan/M1-Custom-FW
    needs: [ build-stm32h573, build-esp32c6, package-sd-assets ]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release_bundle
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.0-farryan' }}
          name: "Monstatek M1 Farryan Custom Firmware (${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.0-farryan' }})"
          generate_release_notes: true
          files: |
            ./release_bundle/MonstaTek_M1_v0800.bin
            ./release_bundle/MonstaTek_M1_v0800.elf
            ./release_bundle/MonstaTek_M1_v0800.hex
            ./release_bundle/MonstaTek_M1_v0800_wCRC.bin
            ./release_bundle/esp32_c6_fw.bin
            ./release_bundle/esp32_c6_fw.bin.md5
            ./release_bundle/M1_SD_Assets.zip
